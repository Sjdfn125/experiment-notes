<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#112a2e" />
    <meta name="description" content="录入实验数据、生成图表并导出结果的本地工作台。" />
    <title>实验笔记 · 数据工作台</title>
  </head>
  <body>
    <header class="app-header">
      <div class="brand"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>实验笔记</div>
      <div class="save-status" id="save-status" role="status">本地保存</div>
    </header>
    <div class="workspace">
      <aside class="sidebar" aria-labelledby="records-heading">
        <div class="sidebar-heading">
          <h2 id="records-heading">实验记录</h2>
          <button id="new-record" class="icon-button" type="button" aria-label="新建记录" title="新建记录">+</button>
        </div>
        <ul class="record-list" id="record-list"></ul>
        <button id="sample-record" class="button sample-button" type="button">载入示例</button>
      </aside>
      <main>
        <div class="record-header">
          <div class="record-heading">
            <h1 id="record-title"></h1>
            <button class="text-button" id="rename-record" type="button">重命名</button>
          </div>
          <p id="record-summary" class="muted"></p>
        </div>
        <div class="panels">
          <div class="data-stack">
          <section class="panel" aria-labelledby="table-heading">
            <div class="panel-header">
              <h2 id="table-heading">数据表格</h2>
              <button id="export-csv" class="button" type="button">导出 CSV</button>
            </div>
            <div class="table-scroll" tabindex="0" role="region" aria-label="可横向滚动的数据表格">
              <table>
                <thead id="table-head"></thead>
                <tbody id="table-body"></tbody>
              </table>
            </div>
            <div class="table-footer">
              <button id="add-row" class="button primary" type="button">＋ 新增行</button>
              <button id="add-column" class="button" type="button">＋ 新增列</button>
            </div>
          </section>
          <details id="analysis" class="panel analysis-panel">
            <summary>统计分析</summary>
            <div class="analysis-body">
              <label>分析列<select id="analysis-column"></select></label>
              <p class="analysis-count" id="analysis-count"></p>
              <dl class="metrics">
                <div><dt>期望估计（样本均值）</dt><dd id="stat-mean">—</dd></div>
                <div><dt>经验方差（除以 n）</dt><dd id="stat-var">—</dd></div>
                <div><dt>样本方差（除以 n−1）</dt><dd id="stat-svar">—</dd></div>
              </dl>
              <h3>经验累积分布</h3>
              <p class="stat-hint">曲线高度表示小于或等于该数值的样本比例。</p>
              <div id="distribution" role="img" aria-label="经验累积分布图"></div>
              <h3>单样本双侧 t 检验</h3>
              <p class="stat-hint">检验总体均值是否等于指定值。适用于独立观测，小样本还要求总体近似正态。</p>
              <div class="axes">
                <label>假设均值 μ₀<input id="null-mean" inputmode="decimal" placeholder="输入待检验的均值"></label>
                <label>显著性水平 α<select id="test-alpha"><option>0.01</option><option selected>0.05</option><option>0.10</option></select></label>
              </div>
              <output id="test-result"></output>
            </div>
          </details>
          </div>
          <section class="panel chart-panel" aria-labelledby="chart-heading">
            <div class="panel-header">
              <h2 id="chart-heading">图表预览</h2>
              <button id="export-png" class="button" type="button">导出 PNG</button>
            </div>
            <div class="chart-settings">
              <div class="chart-types" id="chart-types" role="group" aria-label="图表类型">
                <button type="button" data-chart-type="line">折线图</button>
                <button type="button" data-chart-type="bar">柱状图</button>
                <button type="button" data-chart-type="scatter">散点图</button>
              </div>
              <div class="axes">
                <label>X 轴<select id="x-axis"></select></label>
                <label>Y 轴<select id="y-axis"></select></label>
              </div>
              <div class="style-settings">
                <label>图表标题<input id="chart-title" maxlength="80" placeholder="默认使用记录名称" /></label>
                <label>系列颜色<input id="chart-color" type="color" /></label>
              </div>
              <label id="trend-control" class="trend-control" hidden><input id="trend-line" type="checkbox">显示线性趋势线</label>
            </div>
            <div class="chart-frame">
              <div id="chart" role="img" aria-label="实验数据图表"></div>
              <div id="chart-empty" class="chart-empty" hidden></div>
            </div>
            <p class="chart-status" id="chart-status" role="status"></p>
            <p id="trend-note"></p>
          </section>
        </div>
      </main>
    </div>
    <dialog id="record-dialog">
      <form id="record-form">
        <h2 id="record-dialog-title"></h2>
        <label>记录名称<input id="record-name" required maxlength="64" /></label>
        <div class="dialog-actions">
          <button class="button" type="button" data-close>取消</button>
          <button class="button primary" type="submit">保存</button>
        </div>
      </form>
    </dialog>
    <dialog id="column-dialog">
      <form id="column-form">
        <h2 id="column-dialog-title"></h2>
        <label>列名<input id="column-name" required maxlength="40" /></label>
        <label>单位<input id="column-unit" maxlength="20" placeholder="可选，如 ℃、秒" /></label>
        <label>数据类型<select id="column-kind"><option value="number">数值</option><option value="text">文本</option></select></label>
        <div class="dialog-actions">
          <button id="remove-column" class="button danger" type="button" hidden>删除列</button>
          <button class="button" type="button" data-close>取消</button>
          <button class="button primary" type="submit">保存</button>
        </div>
      </form>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
